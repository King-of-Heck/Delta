[project]
name = "delta"
version = "2.12.5"
description = "Delta — offline Word (.docx) and PDF redline / compare tool with a paged viewer and PDF output"
readme = "README.md"
authors = [
    { name = "King-of-Heck", email = "39289801+King-of-Heck@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1",
    "fpdf2>=2.8",
    "fonttools>=4.62",
    "pillow>=12",
    "pypdf>=6.18,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
